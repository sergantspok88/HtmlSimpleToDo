<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="vendor/bootstrap/bootstrap.min.css">
    <link rel="stylesheet" href="vendor/fira-code/400.css">
    <link rel="stylesheet" href="styles.css">

    <script type="module" src="main.js"></script>

    <title>ToDo</title>
</head>

<body>
    <div class="container-fluid mt-3">
        <header class="d-flex align-items-center justify-content-between flex-wrap gap-2 mb-3">
            <time id="currentTime" class="display-4"></time>
            <div class="d-flex align-items-center gap-2">
                <time id="stopwatch" class="display-4">00:00:00.0</time>
                <button class="btn btn-primary clock-button" id="startPause" type="button" aria-label="Start stopwatch" title="Start stopwatch">&#x23F5;</button>
                <button class="btn btn-danger clock-button" id="reset" type="button" aria-label="Reset stopwatch" title="Reset stopwatch">&#x23F9;</button>
            </div>
        </header>

        <div id="alerts"></div>

        <form id="addTaskForm" class="input-group mb-3">
            <input type="text" id="taskInput" class="form-control" placeholder="Enter a new task" aria-label="New task" autocomplete="off">
            <button class="btn btn-primary" type="submit">Add</button>
            <select id="addPosition" class="form-select" aria-label="Where new tasks are added" title="Where new tasks are added">
                <option value="top">to top</option>
                <option value="bottom">to bottom</option>
            </select>
        </form>

        <ul id="taskList" class="list-group task-list">
        </ul>

        <div class="d-flex justify-content-end gap-2 my-3">
            <button class="btn btn-outline-secondary" id="clearCompletedButton" type="button">Clear Completed</button>
            <button class="btn btn-danger" id="deleteAllButton" type="button">Delete All</button>
        </div>
    </div>

    <template id="taskTemplate">
        <li class="list-group-item task">
            <span class="drag-handle" title="Drag to reorder" aria-hidden="true">&#9776;</span>
            <input type="checkbox" class="task-check">
            <label class="task-name"></label>
            <div class="task-controls">
                <small class="task-completed-at"></small>
                <span class="task-timer"></span>
                <form class="timer-form" hidden>
                    <div class="btn-group btn-group-sm" role="group" aria-label="Preset timers">
                        <button type="button" class="btn btn-outline-secondary" data-action="preset" data-minutes="5" aria-label="Start 5 minute timer">5m</button>
                        <button type="button" class="btn btn-outline-secondary" data-action="preset" data-minutes="15" aria-label="Start 15 minute timer">15m</button>
                        <button type="button" class="btn btn-outline-secondary" data-action="preset" data-minutes="25" aria-label="Start 25 minute timer">25m</button>
                    </div>
                    <input type="number" name="minutes" class="form-control form-control-sm timer-minutes" min="0.1" max="1440" step="any" required placeholder="min" aria-label="Timer length in minutes">
                    <button type="submit" class="btn btn-primary btn-sm">Start</button>
                    <button type="button" class="btn btn-outline-secondary btn-sm" data-action="cancel-timer">Cancel</button>
                </form>
                <button type="button" class="btn btn-secondary btn-sm task-button mirror" data-action="edit" aria-label="Edit task" title="Edit task">&#9998;</button>
                <button type="button" class="btn btn-secondary btn-sm task-button" data-action="timer"></button>
                <button type="button" class="delete-button" data-action="delete" aria-label="Delete task" title="Delete task">X</button>
            </div>
        </li>
    </template>
</body>

</html>
